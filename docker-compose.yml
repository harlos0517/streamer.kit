services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Streamer.bot runs on your host machine, not inside Docker - hardcoded
      # rather than read from .env, since .env's STREAMERBOT_WS_HOST is for
      # non-Docker local dev (127.0.0.1) and would silently break this if reused.
      # host.docker.internal works out of the box on Docker Desktop (Mac/Windows);
      # the `extra_hosts` entry below makes it resolve on native Linux Docker too.
      # If Streamer.bot runs on a different machine, override this line directly.
      STREAMERBOT_WS_HOST: host.docker.internal
      STREAMERBOT_WS_PORT: ${STREAMERBOT_WS_PORT:-8080}
      STREAMERBOT_WS_ENDPOINT: ${STREAMERBOT_WS_ENDPOINT:-/}
      STREAMERBOT_WS_PASSWORD: ${STREAMERBOT_WS_PASSWORD:-}
      HTTP_PORT: 3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      # Baked into the static bundle at build time - see apps/dashboard/Dockerfile.
      args:
        VITE_API_URL: ${DASHBOARD_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  postgres-data:
